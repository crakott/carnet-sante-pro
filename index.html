        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }

            to { opacity: 1; transform: translateX(0); }
        }

        .animate-slide-in { animation: slideIn 0.3s ease-in-out; }

    <div id="root"></div>
    <div id="load-diag" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:99999;padding:30px;font-family:sans-serif;font-size:14px;overflow:auto">
      <p style="font-size:18px;font-weight:bold">⚠️ Erreur de chargement</p>
      <p id="diag-msg" style="color:#dc2626;word-break:break-all;margin-top:10px"></p>
      <p style="margin-top:16px;color:#6b7280">Merci de copier ce message et de l'envoyer pour diagnostic.</p>
    </div>
    <script>
      var diagShown = false;
      function showDiag(msg) {
        if (diagShown) return; diagShown = true;
        document.getElementById('load-diag').style.display = 'block';
        document.getElementById('diag-msg').textContent = msg;
      }
      window.addEventListener('error', function(e) { showDiag('JS: ' + e.message + ' — ' + e.filename + ':' + e.lineno); });
      window.addEventListener('unhandledrejection', function(e) { showDiag('Promise: ' + (e.reason && (e.reason.message || String(e.reason)))); });
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>
